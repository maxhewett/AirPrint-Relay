<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirPrint Relay Updates</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(680px, 100%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.5;
      color: color-mix(in srgb, CanvasText 72%, transparent);
    }

    ul {
      margin: 0;
      padding-left: 20px;
      line-height: 1.8;
    }

    a {
      color: LinkText;
    }
  </style>
</head>
<body>
  <main>
    <h1>AirPrint Relay Updates</h1>
    <p>This GitHub Pages site hosts Sparkle appcasts and release notes for AirPrint Relay.</p>
    <ul>
      <li><a href="./appcast.xml">Stable appcast</a></li>
      <li><a href="./beta/appcast.xml">Beta appcast</a></li>
      <li><a href="./release-notes/">Stable release notes</a></li>
      <li><a href="./beta/release-notes/">Beta release notes</a></li>
    </ul>
  </main>

</html>
